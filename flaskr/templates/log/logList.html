{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Diary Log{% endblock %}</h1>
{% endblock %}

{% block content %}
  <h2>Habits Log</h2>
  {%for log in logs %}
  <a href="{{url_for('log.logPreview',log_date=log.date)}}" class="card-link">
    <div class="card">
      <h3>{{log['date']}}</h3>
    </div>
  </a>
  {% else %}
  <p>ログはありません</p>
  {% endfor %}
{% endblock %}
